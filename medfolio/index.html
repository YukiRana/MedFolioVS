<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedFolio — Sign In</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-root">

    <div class="login-brand">
      <div class="login-logo">Med<em>Folio</em></div>
      <div class="login-subtitle">Professional Dashboard</div>
    </div>

    <section class="login-card" role="main">
      <form id="login-form" novalidate>

        <div class="login-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" class="form-control"
                 required autocomplete="email" placeholder="doctor@example.com">
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" class="form-control"
                   required autocomplete="current-password" placeholder="••••••••">
            <button type="button" id="pw-toggle" aria-label="Show password" class="pw-toggle">👁️</button>
          </div>
        </div>

        <div id="login-error" class="login-error" role="alert" aria-live="assertive" hidden></div>

        <button type="submit" class="btn-primary">Sign In</button>

      </form>
    </section>

  </main>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initLogin);
  </script>
</body>
</html>
